<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; color: #333; }
    .container { max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #eee; border-radius: 12px; }
    .header { text-align: center; margin-bottom: 30px; }
    .button { display: inline-block; padding: 12px 24px; background-color: #3b82f6; color: #fff; text-decoration: none; border-radius: 8px; font-weight: bold; margin: 20px 0; }
    .footer { font-size: 12px; color: #888; text-align: center; margin-top: 40px; }
  </style>
</head>
<body>
  <div className="container">
    <div className="header">
      <h2 style="color: #1e293b;">Confirm your signup</h2>
    </div>
    <p>Welcome to ResumeBuilder!</p>
    <p>Follow this link to confirm your user:</p>
    <p style="text-align: center;">
      <a href="{{ .ConfirmationURL }}" className="button">Confirm your mail</a>
    </p>
    <p>If you didn't create an account, you can safely ignore this email.</p>
    <div className="footer">
      &copy; 2026 ResumeBuilder. All rights reserved.
    </div>
  </div>
</body>
</html>
