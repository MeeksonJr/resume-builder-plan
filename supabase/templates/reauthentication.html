<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #eee;
            border-radius: 12px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .code {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 4px;
            color: #3b82f6;
            text-align: center;
            margin: 30px 0;
        }

        .footer {
            font-size: 12px;
            color: #888;
            text-align: center;
            margin-top: 40px;
        }
    </style>
</head>

<body>
    <div className="container">
        <div className="header">
            <h2 style="color: #1e293b;">Confirm reauthentication</h2>
        </div>
        <p>Hello,</p>
        <p>Please use the following code to confirm your identity:</p>
        <div className="code">
            {{ .Token }}
        </div>
        <p>This code will expire shortly. Do not share this code with anyone.</p>
        <div className="footer">
            &copy; 2026 ResumeBuilder. All rights reserved.
        </div>
    </div>
</body>

</html>
